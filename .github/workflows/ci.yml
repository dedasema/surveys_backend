name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce code style with max line length of 100 characters (.flake8)
          flake8 app --count --exit-zero --max-line-length=100 --statistics

      - name: Run test suite with coverage
        env:
          SECRET_KEY: test_secret_key_ci_environment_32chars_min
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

  deploy:
    name: Continuous Deployment to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check for deployment secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Secrets not configured in GitHub yet. Skipping automatic remote deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/surveys_backend
            git pull origin main
            sudo docker compose up -d --build api worker
            echo "Verificando disponibilidad de la API..."
            HEALTH_CHECK_PASSED=false
            for i in {1..15}; do
              if curl -fsS http://localhost:8000/ > /dev/null && curl -fsS http://localhost:8000/metrics > /dev/null; then
                echo "Healthcheck exitoso en el intento $i: GET / y GET /metrics responden 200 OK."
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "Intento $i/15 fallido, reintentando en 3 segundos..."
              sleep 3
            done

            if [ "$HEALTH_CHECK_PASSED" != "true" ]; then
              echo "ERROR: Falló el healthcheck post-despliegue. La API no responde en GET / o GET /metrics."
              exit 1
            fi

            echo "=== Muestra de Telemetría (/metrics) ==="
            curl -fsS http://localhost:8000/metrics | head -n 20
