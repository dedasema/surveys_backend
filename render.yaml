services:
  - type: web
    name: surveys-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c 'from app.core.database import engine, Base; import app.models; Base.metadata.create_all(bind=engine)'"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SURVEY_LINK_EXPIRY_DAYS
        value: "7"
