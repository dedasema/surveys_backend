services:
  - type: web
    name: surveys-backend
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SURVEY_LINK_EXPIRY_DAYS
        value: "7"
